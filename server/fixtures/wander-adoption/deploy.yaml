apiVersion: deploy.local/v1
kind: Application

metadata:
  name: wander
  labels:
    category: travel

components:
  web:
    displayName: Wander
    build:
      context: .
      ignore: [wander.tar.gz, tests, Wander]
    role: web
    capacity:
      memoryBytes: 4294967296
      cpuMillicores: 2000
    interfaces:
      http:
        port: 3000
        protocol: http
    mounts:
      /app/data:
        resource: data
      /app/uploads:
        resource: uploads
    health:
      interface: http
      path: /api/health

resources:
  data:
    type: volume
    durability: durable
    dataRole: files
    access: singleWriter
    consistencyGroup: application
    ownership: application
    backup:
      policy: required
      retentionCopies: 2
    suitcase:
      allowedDataModes: [follows-one-site, site-local, syncs-across-sites]

  uploads:
    type: volume
    durability: durable
    dataRole: files
    access: singleWriter
    consistencyGroup: application
    ownership: application
    backup:
      policy: required
      retentionCopies: 2
    suitcase:
      allowedDataModes: [follows-one-site, site-local, syncs-across-sites]

routes:
  public:
    to: web.http
    path: /
    discoverable: true
