<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-board" content="width=820,height=960">
<title>Mac app: the remembered rail, with room for the traffic lights</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<style>
body{margin:0;background:#e9e9ee}
.mac-window{border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 24px 60px rgba(0,0,0,.18);background:#fafafb}
.mac-window.full{border-radius:0;box-shadow:none}
.mac-window .dl-app{height:100%;min-height:0}
.mac-lights{display:inline-flex;gap:8px;align-items:center;flex:none;padding:0 12px 0 4px}
.mac-lights span{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.mac-drag{outline:1.5px dashed rgba(59,130,246,.55);outline-offset:-3px}
.dl-side-top.mac-drag{height:52px;align-items:center}
.dl-side-top .dl-brand{flex:1}
.mac-head{height:52px;align-items:center}
.mac-head .dl-t{font-weight:600}
.mac-key{display:flex;gap:16px;align-items:center;font:13px/16px 'Hanken Grotesk',system-ui,sans-serif;color:#55555f;margin-top:16px}
.mac-key i{display:inline-block;width:18px;height:12px;outline:1.5px dashed rgba(59,130,246,.75);outline-offset:-1px;margin-right:6px;vertical-align:-1px}

/* One Mac sidebar choice, retained on every page and at both review widths. */
body{background:var(--sidebar)}
.mac-stage{width:100%!important;padding:24px 16px!important}
.mac-window{position:relative;width:100%!important;background:var(--paper)}
.mac-window .dl-side{display:flex;flex:0 0 256px;width:256px}
.mac-window .dl-side-top{height:52px;box-sizing:border-box;padding:0 8px 0 16px;gap:8px}
.mac-window .dl-side-top .mac-lights{width:76px;box-sizing:border-box;padding:0;gap:8px}
.mac-window .dl-side-top .dl-brand{min-width:20px;flex:1}
.mac-drag{-webkit-app-region:drag;outline:none}
.mac-drag :is(button,a,input){-webkit-app-region:no-drag}
.mac-window .mac-head{height:52px}
.mac-key{font:13px/20px var(--font-sans);color:var(--muted);flex-wrap:wrap;justify-content:center;max-width:100%}
.mac-key i{display:none}
.mac-window .dl-composer-bar{flex-wrap:wrap}
@media(max-width:820px){.mac-window .dl-col{padding-left:20px;padding-right:20px}.mac-window .dl-menu-btn{display:none}}

body{margin:0;background:#fafafb}
.rail{width:64px;flex:none;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:2px;padding-bottom:12px;background:var(--sidebar);border-right:1px solid var(--line);font-family:var(--font-sans)}
.rail a,.rail .tog{position:relative;width:40px;height:40px;flex:none;border:0;padding:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);text-decoration:none;cursor:pointer}
.rail a.on{background:color-mix(in srgb,var(--accent) 12%,var(--sidebar));color:var(--accent)}
.rail a.mark{height:48px;margin-bottom:4px}
.rail a.mark .dl-mark{width:26px;height:26px;border-radius:8px;font-size:13px}
.rail .dot{position:absolute;right:8px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--danger);box-shadow:0 0 0 2px var(--sidebar)}
.rail .n{position:absolute;right:1px;top:2px;min-width:15px;height:15px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--danger);color:#fff;font:600 10px/15px var(--font-sans);text-align:center}
.rail .sep{width:28px;height:1px;flex:none;background:var(--line);margin:4px 0}
.rail .grow{flex:1}
.rail .tog{background:var(--selection)}
.rail .tip{position:absolute;left:48px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:#18181b;color:#fff;font:500 12px/16px var(--font-sans);white-space:nowrap;z-index:5;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.rail .tip kbd{font:inherit;color:#a1a1aa}
.rail a.who{width:28px;height:28px;margin-top:6px;border-radius:50%;background:var(--line);font:600 12px var(--font-sans);color:var(--ink-soft)}


.mac-window .rail{display:flex;width:64px;padding-top:52px;background:var(--sidebar)}
.mac-window .rail .mark{height:40px}
.mac-window .mac-head{padding-left:44px}
.mac-window .mac-head .mac-lights{position:absolute;top:0;left:16px;height:52px;padding:0;z-index:2}

</style>
</head>
<body>
<div data-layer="div" class="mac-stage" style="width:820px;height:960px;box-sizing:border-box;padding:40px;display:flex;flex-direction:column;align-items:center">
<div data-layer="mac-window" class="mac-window" style="width:720px;height:820px">
<div data-layer="app" class="dl-app"><nav data-layer="rail-deploy-local" class="rail mac-rail" aria-label="deploy.local">
  <a data-layer="rail-new-task" href="Home.html" class="mark" aria-label="New task" title="New task  ⌘N"><span data-layer="rail-d" class="dl-mark">d</span></a>
  <a data-layer="rail-projects" href="Projects.html" aria-label="Projects"><svg data-layer="rail-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></a>
  <a data-layer="rail-live" href="Live.html" aria-label="Live · 1 failing"><svg data-layer="rail-svg-2" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><i data-layer="rail-dot" class="dot"></i></a>
  <a data-layer="rail-computers" href="Compute.html" aria-label="Computers"><svg data-layer="rail-svg-3" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM8 20h8M12 16v4"/></svg></a>
  <a data-layer="rail-design" href="DesignCanvas.html" aria-label="Design"><svg data-layer="rail-svg-4" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg></a>
  <span data-layer="rail-sep" class="sep"></span>
  <a data-layer="rail-waiting-on-you" href="Inbox.html" aria-label="Waiting on you · 3"><svg data-layer="rail-svg-5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0M12 7v6M12 17h.01"/></svg><span data-layer="rail-3" class="n">3</span></a>
  <span data-layer="rail-grow" class="grow"></span>
  <button data-layer="show-sidebar" type="button" class="dl-icon-btn tog" aria-label="Expand sidebar"><svg data-layer="svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a data-layer="rail-mac-update" href="MacUpdateAvailable.html" aria-label="Update available for deploy.local for Mac" title="Update available · deploy.local for Mac · 9c41e7f"><svg data-layer="svg-9" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 17v4h14v-4"/></svg></a>
  <a data-layer="rail-settings" href="Settings.html" class="who" aria-label="Settings · Gabriel">G</a>
</nav><main data-layer="main" class="dl-main">
<header data-layer="head" class="dl-head mac-drag mac-head"><span data-layer="mac-lights" class="mac-lights" aria-hidden="true"><span data-layer="span" style="background:#ff5f57"></span><span data-layer="span-2" style="background:#febc2e"></span><span data-layer="span-3" style="background:#28c840"></span></span><span data-layer="new-task" class="dl-t">New task</span><span data-layer="end" class="dl-end"><button data-layer="show-panel" type="button" class="dl-icon-btn" aria-label="Show panel"><svg data-layer="svg-2" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button></span></header>
<div data-layer="scroll" class="dl-scroll" style="display:flex;flex-direction:column;justify-content:center">
  <div data-layer="col" class="dl-col" style="padding-bottom:64px;display:flex;flex-direction:column;gap:24px">
    <div data-layer="greeting" class="dl-greeting"><span data-layer="d" class="dl-mark" style="width:40px;height:40px;border-radius:12px;font-size:17px">d</span><h1 data-layer="what-should-we" class="dl-title">What should we build?</h1><span data-layer="agents-work-on" class="dl-soft">Agents work on your computers. You approve merges and releases.</span></div>
    <div data-layer="dock" class="dl-dock" style="padding:0"><form data-layer="composer" class="dl-composer"><label data-layer="message" for="new-task" class="dl-sr">Message</label><input data-layer="input" id="new-task" type="text" placeholder="Ask, build, or follow up…"><div data-layer="composer-bar" class="dl-composer-bar"><button data-layer="attach" type="button" class="dl-icon-btn sm" aria-label="Attach"><svg data-layer="svg-3" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button><span data-layer="chip" class="dl-chip"><svg data-layer="svg-4" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>home-gym</span><span data-layer="chip-2" class="dl-chip"><svg data-layer="svg-5" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Any free computer</span><span data-layer="grow" class="dl-grow"></span><button data-layer="auto" type="button" class="dl-model">Auto <svg data-layer="svg-6" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button><button data-layer="voice" type="button" class="dl-icon-btn sm" aria-label="Voice"><svg data-layer="svg-7" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button data-layer="send" type="button" class="dl-send" aria-label="Send"><svg data-layer="svg-8" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></div></form></div>
  </div>
</div>
</main></div>
</div>
<div data-layer="mac-key" class="mac-key"><span data-layer="span-4"><i data-layer="i"></i>Drag region: moves the window; double-click zooms</span><span data-layer="no-title-bar">64 px rail, chosen once for every page. Lights reserve the first 92 px; rail items start below them.</span></div>
</div>
</body>
</html>
