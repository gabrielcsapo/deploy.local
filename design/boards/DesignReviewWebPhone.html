/* The page is 108 px header + 562 px native crop + 64 px change bar + 110 px toolbar. */
@scope (.pager-phone) to (.dl-shot-snapshot) {
.pager-stage .web-crop{width:390px;height:562px}
.web-width{left:12px;right:auto;box-shadow:none}
.web-overview{position:absolute;right:12px;top:12px;width:74px;height:47px;padding:0;border:1px solid var(--line-strong);border-radius:4px;background:var(--paper);overflow:hidden;cursor:pointer;z-index:3}
.web-overview svg{display:block;width:72px;height:45px;pointer-events:none}
.overview-viewport{fill:color-mix(in srgb,var(--accent) 10%,transparent);stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.change-bar{height:64px;flex:none;display:flex;align-items:center;gap:4px;padding:0 8px;border-top:1px solid var(--line);background:var(--paper)}
.change-copy{flex:1;min-width:0;font-size:13px;line-height:18px;color:var(--ink);text-align:center;text-wrap:balance}
.change-count{color:var(--muted)}
.change-bar .dl-ph-btn:disabled{color:var(--line-strong);cursor:default}
}
/* Freeze Welcome.html at its native 1440 × 900 desktop layout inside the phone.
   The host's 390 px media queries must not reflow the snapshot. */
@scope (.welcome-snapshot) {
.welcome-col{padding:0 32px 64px;display:flex;flex-direction:column;gap:24px;position:relative}
.dl-head{padding-left:20px}
.dl-composer input{font-size:15px}
.dl-app .dl-btn{border-radius:var(--radius-control)}
.dl-dock{position:relative}
.snapshot-change-outline{position:absolute;inset:-5px;border:1.5px solid var(--accent);border-radius:var(--radius-control);pointer-events:none;z-index:1}
.change-number{position:absolute;left:8px;top:-12px;display:grid;place-items:center;width:22px;height:22px;box-sizing:border-box;border:1.5px solid var(--accent);border-radius:var(--radius-full);background:var(--surface);color:var(--accent);font-size:12px;line-height:18px;font-weight:600}
.gutter-outline{left:auto;right:0;top:0;bottom:64px;width:32px}
.gutter-outline .change-number{left:4px}
}

/* Full-size review controls; snapshot styles stay inside their own scope. */
@scope (.pager-phone) to (.dl-shot-snapshot) {
.pager-tools{gap:8px;flex-wrap:nowrap}.pager-tools>*{flex-shrink:0}
.compare-tool{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--surface);font:inherit;font-size:13px;white-space:nowrap}
.compare-tool[aria-pressed=true]{background:var(--selection);border-color:var(--ink)}
.compare-tool:disabled{color:var(--muted);background:var(--paper);border-style:dashed}.pager-tools .dl-ph-btn:disabled{color:var(--muted);opacity:.45;cursor:default}
.width-tool{margin-left:auto;min-width:50px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);white-space:nowrap}
.width-tool span{border:1px solid var(--line);border-radius:var(--radius-full);padding:2px 9px;line-height:18px}
.viewer-meta{display:flex;align-items:center;justify-content:space-between;height:18px;margin-top:2px;gap:8px;font-size:12px;line-height:18px;color:var(--muted);white-space:nowrap}
.pager-seen{margin:0;font-size:12px}.pager-track{margin-top:8px}.tool-done{display:flex;align-items:center;justify-content:center;min-width:48px;height:44px;font-size:15px;font-weight:600}
.menu-popover a{justify-content:flex-start;gap:10px}.before-capsule,.after-capsule{white-space:nowrap}
.shot-stack:active .after-shot{visibility:visible}.shot-stack:active .before-shot{visibility:hidden}
.compare-stage .shot-stack>div{visibility:visible!important;pointer-events:none}
.compare-stage .compare-before{clip-path:inset(0 60% 0 0);z-index:1}
.compare-stage .compare-after{clip-path:inset(0 0 0 40%)}
.compare-stage .before-capsule{left:12px;right:auto;z-index:3}
.after-capsule{position:absolute;right:12px;top:12px;padding:4px 9px;border-radius:var(--radius-full);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm);font-size:13px;line-height:18px;font-weight:600;z-index:3}
.scrub-divider{position:absolute;top:0;bottom:0;left:40%;width:2px;transform:translateX(-1px);background:var(--ink);box-shadow:0 0 0 1px var(--surface);z-index:4}
.scrub-handle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--ink);border-radius:var(--radius-full);background:var(--surface);box-shadow:var(--shadow-sm)}
.draw-controls{display:flex;align-items:center;justify-content:space-between;height:44px;gap:12px}.draw-controls a,.draw-controls button{min-height:44px;min-width:60px;display:inline-flex;justify-content:center;align-items:center;gap:6px;font:inherit;background:none;border:0}.draw-controls .next{font-weight:600}
.draw-guide{font-size:13px;line-height:18px;color:var(--muted);text-align:center;margin-top:6px!important}
.drawing-overlay{position:absolute;inset:0;width:390px;height:626px;pointer-events:none;color:var(--accent);z-index:2}
.draw-context{display:flex;align-items:center;gap:12px}.draw-thumbnail{flex:none;width:112px;height:84px;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius-control);background:var(--paper)}
.draw-thumbnail svg{display:block;width:112px;height:84px}.draw-context-copy{font-size:13px;line-height:18px;color:var(--muted)}
.draw-context-copy strong{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.drawing-sheet{height:560px}.drawing-sheet .pin-form{gap:12px;padding-top:4px}.drawing-sheet .pin-context{height:24px}
.saved-drawing-pin{top:202px;left:326px;z-index:3;width:44px;height:44px}
.saved-comment{position:absolute;left:16px;right:16px;bottom:20px;z-index:3;display:flex;align-items:flex-start;gap:12px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);box-shadow:var(--shadow-sm)}
.saved-comment p{font-size:17px;line-height:24px}.saved-comment small{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:6px}
@media(prefers-reduced-motion:reduce){.scrub-divider,.drawing-overlay,.native-sheet{animation:none;transition:none}}
}
