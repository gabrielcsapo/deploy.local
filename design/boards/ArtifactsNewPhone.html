<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-board" content="width=390,height=844">
<title>iPhone — New design: name it and choose the project</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.dl-phone{height:auto;min-height:844px}
.pk-phone{padding-top:54px;background:var(--selection);display:flex;flex-direction:column}
.pk-sheet{flex:1;display:flex;flex-direction:column;min-height:790px;box-sizing:border-box;border-radius:var(--radius-dialog) var(--radius-dialog) 0 0;background:var(--paper);padding-bottom:32px}
.pk-head{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;min-height:52px;padding:0 8px}
.pk-title{grid-column:2;margin:0;font-size:17px;line-height:22px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-done{grid-column:3;justify-self:end;width:auto;min-width:44px;color:var(--ink);font-size:16px}
.dl-ph-label{padding:20px 32px 8px}
.dl-ph-row{min-height:64px;padding:10px 16px;gap:14px}
.dl-ph-group .dl-ph-row:last-child{border-bottom:0}
.dl-ph-row .dl-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.dl-phone .dl-ph-row .dl-t>span{white-space:normal;overflow:visible;text-overflow:clip}
.dl-ph-row .dl-t>span:first-child{font-size:17px;line-height:22px;font-weight:500}
.dl-ph-row .dl-t>span+span{font-size:13px;line-height:18px;color:var(--muted)}
.dl-ph-row .dl-t .dl-mono{font-size:15px;line-height:22px}
button.dl-ph-row{width:100%;border-top:0;border-right:0;border-left:0;background:transparent;text-align:left;cursor:pointer}
.dl-ph-note{margin:8px 32px 0}
.pk-empty{padding:4px 32px 8px;display:flex;flex-direction:column;gap:4px}
.pk-empty>span:first-child{font-size:15px;line-height:24px;font-weight:600;color:var(--ink)}
.pk-empty>span+span{font-size:13px;line-height:20px;color:var(--ink-soft)}
</style>
</head>
<body>
<div data-layer="phone" class="dl-phone pk-phone"><section data-layer="sheet" class="dl-sheet pk-sheet" role="dialog" aria-modal="true"><header data-layer="pk-head" class="pk-head"><a data-layer="cancel" href="ArtifactsPhone.html" class="dl-ph-btn" style="grid-column:1;justify-self:start;width:auto;min-width:44px;padding:0 8px;font-size:16px">Cancel</a><h1 data-layer="new-design" class="pk-title">New design</h1><a data-layer="create" href="DesignCanvasPhone.html" class="dl-ph-btn pk-done" style="font-weight:600;padding:0 8px">Create</a></header><div data-layer="ph-body" class="dl-ph-body" style="overflow:visible"><div data-layer="ph-group" class="dl-ph-group" style="margin-top:12px"><label data-layer="ph-row" class="dl-ph-row"><span data-layer="t" class="dl-t"><span data-layer="name">Name</span></span><span data-layer="onboarding-flow" class="dl-ph-value" style="max-width:60%;color:var(--ink)">Onboarding flow</span></label><a data-layer="ph-row-2" href="ArtifactsNewPhone.html" class="dl-ph-row"><span data-layer="t-2" class="dl-t"><span data-layer="project">Project</span></span><span data-layer="forma" class="dl-ph-value">forma</span><svg data-layer="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="dl-chev"><path d="M9 6l6 6-6 6"/></svg></a></div><div data-layer="deploy-local-adds" class="dl-ph-note">deploy.local adds artifacts/onboarding-flow to forma on a new branch, artifact/onboarding-flow. It reaches main when you approve it.</div></div></section></div>
</body>
</html>
