<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="design-board" content="width=390,height=844">
<title>iPhone — sign in with a password</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.dl-phone{background:var(--sidebar)}
.dl-sheet{margin-top:64px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border-radius:var(--radius-dialog) var(--radius-dialog) 0 0}
.sheet-grabber{flex:none;align-self:center;width:36px;height:5px;margin:8px 0;border-radius:var(--radius-full);background:var(--line-strong)}
.dl-sheet .dl-ph-top{padding:0 8px 4px}
.dl-ph-body{overflow-y:auto;padding-bottom:20px}
.sheet-title{margin:12px 32px 0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.02em}
.sheet-footer{flex:none;padding:16px 16px 32px;display:flex;flex-direction:column;gap:12px}
.sheet-footer .dl-ph-note{margin:0 16px}
.password-row{flex-direction:column;align-items:stretch;gap:0;min-height:80px;padding:8px 16px}
.password-row label{font-size:17px;line-height:24px}
.password-row input{width:100%;min-width:0;min-height:44px;box-sizing:border-box;padding:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:17px;outline-offset:2px}
</style>
</head>
<body>
<div data-layer="phone" class="dl-phone dl-list">
<section data-layer="sheet" class="dl-sheet" role="dialog" aria-modal="true" aria-labelledby="password-title">
<div data-layer="sheet-grabber" class="sheet-grabber" aria-hidden="true"></div>
<header data-layer="ph-top" class="dl-ph-top"><a data-layer="back-to-sign" class="dl-ph-btn" href="SignInPhone.html" aria-label="Back to sign in"><svg data-layer="svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></a><span data-layer="t" class="dl-t"></span><span data-layer="span" style="width:44px"></span></header>
<div data-layer="ph-body" class="dl-ph-body">
<h1 data-layer="sign-in-with" id="password-title" class="sheet-title">Sign in with a password</h1>
<div data-layer="server" class="dl-ph-label" id="server-label">Server</div>
<div data-layer="ph-group" class="dl-ph-group" role="group" aria-labelledby="server-label">
<div data-layer="ph-row" class="dl-ph-row password-row"><label data-layer="address" for="address">Address</label><input data-layer="input" id="address" type="url" value="https://deploy.local" inputmode="url" autocapitalize="none" spellcheck="false"></div>
</div>
<div data-layer="account" class="dl-ph-label" id="account-label">Account</div>
<div data-layer="ph-group-2" class="dl-ph-group" role="group" aria-labelledby="account-label">
<div data-layer="ph-row-2" class="dl-ph-row password-row"><label data-layer="username" for="username">Username</label><input data-layer="input-2" id="username" type="text" value="gabriel" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
<div data-layer="ph-row-3" class="dl-ph-row password-row"><label data-layer="password" for="password">Password</label><input data-layer="input-3" id="password" type="password" autocomplete="current-password"></div>
</div>
</div>
<footer data-layer="sheet-footer" class="sheet-footer">
<a data-layer="sign-in" class="dl-btn primary" href="SignInTrustPhone.html">Sign in</a>
<p data-layer="the-app-checks" class="dl-ph-note">The app checks SER's certificate itself. Your login stays in this iPhone's Keychain.</p>
</footer>
</section>
</div>
</body>
</html>
