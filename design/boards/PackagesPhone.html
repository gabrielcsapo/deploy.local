<style>
body{margin:0;background:var(--paper)}
/* The whole tab scrolls, so the board shows its full length; Sign out ends it. */
.dl-phone{height:auto;min-height:844px}
.dl-ph-body{overflow:visible;padding-bottom:32px}
.dl-ph-large{padding:4px 20px 16px}
.dl-ph-label{padding:28px 32px 8px}
.dl-ph-row{min-height:56px;padding:10px 16px;gap:14px}
.dl-ph-group .dl-ph-row:last-child{border-bottom:0}
.dl-ph-row .dl-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.dl-ph-row .dl-t>span:first-child{font-size:16px;line-height:22px;font-weight:500}
.dl-ph-row .dl-t>span+span{font-size:13px;line-height:18px;color:var(--muted)}
button.dl-ph-row{width:100%;border-top:0;border-right:0;border-left:0;background:transparent;text-align:left;cursor:pointer}
.settings-account{min-height:72px;padding:12px 16px}
.settings-account .dl-t>span:first-child{font-size:17px;font-weight:600}
.appearance-choice{min-width:96px;min-height:44px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:16px;text-align:right}
.sign-out-group{margin:36px 16px 0}
button.sign-out{min-height:56px;justify-content:center;text-align:center;color:var(--danger);font-size:16px;font-weight:500}
.certificate-row{min-height:80px}
.certificate-row .dl-t>span{white-space:normal;overflow:visible;text-overflow:clip}
.dl-phone .certificate-forget{width:auto;min-width:44px;flex:none;font-size:16px;color:var(--danger)}
</style>
