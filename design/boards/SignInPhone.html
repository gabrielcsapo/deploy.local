<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-board" content="width=390,height=844">
<title>iPhone — sign in by scanning a code</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#fafafb}
</style>
</head>
<body>
<div data-layer="phone" class="dl-phone"><header data-layer="ph-top" class="dl-ph-top"><span data-layer="span" style="width: 44px"></span><span data-layer="t" class="dl-t"></span><span data-layer="span-2" style="width: 44px"></span></header><div data-layer="sign-in" class="dl-ph-large">Sign in</div><div data-layer="ph-body" class="dl-ph-body">
<div data-layer="div" style="padding:0 24px;display:flex;flex-direction:column;gap:16px">
  <span data-layer="on-a-computer" class="dl-soft" style="font-size:17px;line-height:24px">On a computer that is signed in, open Settings › Account › Add iPhone, then scan the code it shows.</span>
  <div data-layer="div-2" style="margin:8px auto 0;width:240px;height:240px;border-radius:24px;background:#1c1b1f;position:relative"><span data-layer="span-3" style="position:absolute;top:22px;left:22px;width:36px;height:36px;border-top:4px solid #fff;border-left:4px solid #fff;border-top-left-radius:12px"></span><span data-layer="span-4" style="position:absolute;top:22px;right:22px;width:36px;height:36px;border-top:4px solid #fff;border-right:4px solid #fff;border-top-right-radius:12px"></span><span data-layer="span-5" style="position:absolute;bottom:22px;left:22px;width:36px;height:36px;border-bottom:4px solid #fff;border-left:4px solid #fff;border-bottom-left-radius:12px"></span><span data-layer="span-6" style="position:absolute;bottom:22px;right:22px;width:36px;height:36px;border-bottom:4px solid #fff;border-right:4px solid #fff;border-bottom-right-radius:12px"></span></div>
  <span data-layer="the-code-carries" class="dl-meta" style="font-size:13px;line-height:18px;text-align:center">The code carries SER's address, its certificate and a one-time sign-in, so there is nothing to type or check.</span>
</div>
<div data-layer="ph-group" class="dl-ph-group" style="margin-top:20px"><a data-layer="ph-row" href="#" class="dl-ph-row"><svg data-layer="svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg><span data-layer="t-2" class="dl-t"><span data-layer="sign-in-with">Sign in with a password</span><span data-layer="you-will-check">You will check SER's certificate by hand</span></span></a></div>
</div></div>
