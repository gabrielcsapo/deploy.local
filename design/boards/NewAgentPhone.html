<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="design-board" content="width=390,height=844">
<title>iPhone — New agent: a name and an avatar</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.dl-phone{height:min(844px,100dvh);background:var(--sidebar)}
.dl-sheet{flex:1;min-height:0;margin-top:64px;display:flex;flex-direction:column;border-radius:var(--radius-dialog) var(--radius-dialog) 0 0;box-shadow:var(--shadow-lg);overflow:hidden}
.sheet-grabber{flex:none;align-self:center;width:36px;height:5px;margin:8px 0 0;border-radius:var(--radius-full);background:var(--line-strong)}
.dl-sheet .dl-ph-top{padding:0 8px 4px;border-bottom:1px solid var(--line)}
.dl-sheet .dl-ph-body{overflow-y:auto;overscroll-behavior:contain;padding:16px 0;scroll-padding:16px}
.sheet-intro{padding:0 20px 16px}
.sheet-intro h1{margin:4px 0 6px;font-size:22px;line-height:28px;font-weight:600}
.sheet-intro p{margin:0;font-size:13px;line-height:18px;color:var(--muted)}
.dl-sheet .dl-ph-label{padding-top:16px}
.dl-sheet .dl-ph-row{min-height:56px}
.draft-fields{padding:0 20px;display:flex;flex-direction:column;gap:12px}
.draft-fields .dl-field{height:44px;font-family:var(--font-sans);font-size:17px}
.draft-fields .dl-textarea{min-height:112px;font-family:var(--font-sans);font-size:17px;line-height:24px;resize:vertical}
.sheet-footer{flex:none;padding:12px 20px max(24px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.sheet-footer .dl-btn{box-sizing:border-box}
.dl-phone .dl-item .dl-t > span{white-space:normal}.dl-phone .dl-section-sub,.dl-phone .dl-meta{font-size:13px;line-height:18px}
.dl-ph-row .dl-t > span:first-child{font-size:13px;line-height:20px;font-weight:500}
.dl-ph-row .dl-t > span + span{font-size:12px;line-height:16px}
.dl-ph-row .dl-chev{color:var(--muted)}

/* Board-local avatar studies, derived from the design-system hues. */
.agent-avatar{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:var(--radius-full);overflow:hidden;vertical-align:middle}
.agent-avatar svg{display:block;width:100%;height:100%}.agent-avatar.hero{width:88px;height:88px}.agent-avatar.large{width:64px;height:64px}
.dl-nav .dl-lead:has(.agent-avatar){width:28px}.dl-nav:has(.agent-avatar){gap:10px}
.agent-identity{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;color:var(--ink)}
.agent-identity .dl-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar-edit{display:flex;flex-direction:column;align-items:center;gap:4px}.avatar-edit a{display:inline-flex;flex-direction:column;align-items:center;gap:8px;min-height:44px}.avatar-edit .dl-btn{min-height:44px}
.avatar-colors{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0;width:100%;max-width:360px;margin:4px auto}
.color-choice{border:0;background:transparent;min-width:0;height:44px;padding:4px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.color-choice span{width:22px;height:22px;display:block;border-radius:50%;background:var(--swatch);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.color-choice[aria-pressed="true"] span{outline:2px solid var(--ink);outline-offset:3px}
.avatar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.avatar-choice{display:flex;align-items:center;justify-content:center;min-height:76px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--paper)}.avatar-choice[aria-pressed="true"]{border:2px solid var(--ink)}
.agent-modal-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--ink) 22%,transparent);box-sizing:border-box}
.agent-modal{max-width:420px;max-height:calc(100dvh - 48px);overflow-y:auto;padding:24px;gap:20px}.agent-modal .dl-dialog-head h2{font-size:22px;line-height:28px}
.agent-modal .dl-field{height:44px;font-size:15px}.agent-modal .dl-dialog-foot .dl-btn{min-width:88px;height:44px}
.agent-form{display:flex;flex-direction:column;gap:8px}.agent-form label{font-size:13px;line-height:20px;font-weight:500}.agent-form .dl-field{height:44px}.agent-form .dl-textarea{font:inherit;line-height:24px;resize:vertical}
.agent-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.agent-section-head .dl-btn{min-height:44px}
.agent-details .dl-section{gap:8px}.agent-details .dl-setting{flex-wrap:wrap}.agent-details .dl-setting .dl-v{max-width:100%}
.agent-greeting{gap:12px;padding:56px 0 28px}.agent-greeting h3{font-size:22px;line-height:28px}.agent-greeting p{font-size:15px;line-height:24px;max-width:440px}
.first-messages{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;max-width:620px}.first-message{border:1px solid var(--line-strong);border-radius:var(--radius-control);background:var(--surface);padding:10px 14px;min-height:44px;font:inherit;font-size:13px;line-height:20px;cursor:pointer;text-align:left}
:where(button,a,input,textarea,select):focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.dl-phone .agent-avatar{width:32px;height:32px}.dl-phone .agent-avatar.hero{width:88px;height:88px}.dl-phone .agent-avatar.large{width:64px;height:64px}
.dl-phone .avatar-colors{grid-template-columns:repeat(5,44px);justify-content:center;gap:0 10px;max-width:100%}
.dl-phone .avatar-edit .dl-btn{width:auto}.dl-phone .agent-form .dl-field,.dl-phone .agent-form .dl-textarea{font-size:17px}
.dl-phone .agent-greeting{padding:32px 20px 20px}.dl-phone .agent-greeting p{font-size:17px;line-height:24px}
.dl-phone .first-messages{margin-top:12px;gap:8px;width:100%}.dl-phone .first-message{width:100%;font-size:15px;line-height:20px}
.dl-phone .agent-section-head .dl-btn{width:auto;font-size:15px}.dl-phone .agent-form{padding:0 20px}.dl-phone .agent-form label{font-size:13px}
.dl-phone .agent-identity{justify-content:center;gap:8px}.dl-phone .agent-identity .agent-avatar{width:28px;height:28px}.dl-phone .agent-identity span{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:820px){.agent-modal-layer{padding:16px}.agent-modal{max-height:calc(100dvh - 32px)}}

.dl-phone .dl-sheet{flex:none;margin-top:auto;height:540px;max-height:calc(100dvh - 64px)}.dl-sheet .dl-ph-body{display:flex;flex-direction:column;gap:8px}.dl-sheet .sheet-footer{padding-bottom:max(28px,env(safe-area-inset-bottom))}
</style>
</head>
<body>
<div data-layer="phone" class="dl-phone">
<section data-layer="sheet" class="dl-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
<div data-layer="sheet-grabber" class="sheet-grabber" aria-hidden="true"></div>
<header data-layer="ph-top" class="dl-ph-top"><span data-layer="span" style="width:44px"></span><span data-layer="new-agent" id="sheet-title" class="dl-t">New agent</span><a data-layer="cancel-new-agent" href="WorkAgentsPhone.html" class="dl-ph-btn" aria-label="Cancel new agent"><svg data-layer="svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></header>
<div data-layer="ph-body" class="dl-ph-body"><div data-layer="avatar-edit" class="avatar-edit"><a data-layer="change-avatar" href="AgentAvatarPickerPhone.html" aria-label="Change avatar"><span data-layer="agent-avatar" class="agent-avatar hero" data-glyph="variant28" data-glyph-color="af61f2"><svg data-layer="agent-redesign-svg-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" fill="none" shape-rendering="auto" aria-hidden="true"><defs><g id="shape-variant28-c71b340e"><path d="M14.23 33.75V26.3c0-6.98 5.71-12.7 12.7-12.7s12.7 5.72 12.7 12.7v7.44" stroke="#af61f2" stroke-width="8.95" stroke-miterlimit="10"/></g><clipPath id="clip-c71b340e"><rect width="72" height="72" rx="0" ry="0"/></clipPath></defs><g clip-path="url(#clip-c71b340e)"><mask id="glyph-NewAgentPhonehtml-1" style="mask-type:alpha"><path fill="white" d="M0 0h72v72H0z"/></mask><g mask="url(#glyph-NewAgentPhonehtml-1)"><path fill="var(--surface)" d="M0 0h72v72H0z"/><path opacity=".2" fill="#af61f2" d="M0 0h72v72H0z"/><use transform="translate(9.07 12.32)" href="#shape-variant28-c71b340e"/><ellipse cx="36" cy="103.72" rx="43.31" ry="50" fill="#af61f2"/><ellipse cx="36" cy="103.72" rx="43.31" ry="50" fill="black" fill-opacity=".5"/></g></g></svg></span><span data-layer="choose-avatar" class="dl-meta">Choose avatar</span></a><button data-layer="shuffle" type="button" class="dl-btn quiet" data-action="shuffle-avatar">Shuffle</button></div><div data-layer="avatar-color" class="avatar-colors" role="group" aria-label="Avatar color"><button data-layer="violet" type="button" class="color-choice" aria-label="Violet" aria-pressed="true" data-action="choose-avatar-color" style="--swatch:#af61f2"><span data-layer="span-2" aria-hidden="true"></span></button><button data-layer="blue" type="button" class="color-choice" aria-label="Blue" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#76a7ff"><span data-layer="span-3" aria-hidden="true"></span></button><button data-layer="green" type="button" class="color-choice" aria-label="Green" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#75c675"><span data-layer="span-4" aria-hidden="true"></span></button><button data-layer="amber" type="button" class="color-choice" aria-label="Amber" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#e8b130"><span data-layer="span-5" aria-hidden="true"></span></button><button data-layer="coral" type="button" class="color-choice" aria-label="Red" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#ff4d6f"><span data-layer="span-6" aria-hidden="true"></span></button><button data-layer="lilac" type="button" class="color-choice" aria-label="Indigo" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#525fa3"><span data-layer="span-7" aria-hidden="true"></span></button><button data-layer="sky" type="button" class="color-choice" aria-label="Teal" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#2fb5a3"><span data-layer="span-8" aria-hidden="true"></span></button><button data-layer="mint" type="button" class="color-choice" aria-label="Orange" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#ffaa64"><span data-layer="span-9" aria-hidden="true"></span></button><button data-layer="sand" type="button" class="color-choice" aria-label="Pink" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#e66bb8"><span data-layer="span-10" aria-hidden="true"></span></button><button data-layer="rose" type="button" class="color-choice" aria-label="Gray" aria-pressed="false" data-action="choose-avatar-color" style="--swatch:#8c8c8c"><span data-layer="span-11" aria-hidden="true"></span></button></div><div data-layer="agent-form" class="agent-form"><label data-layer="name" for="agent-name">Name</label><input data-layer="field" id="agent-name" class="dl-field" value="Release notes writer" autocomplete="off"></div></div>
<footer data-layer="sheet-footer" class="sheet-footer"><a data-layer="create" href="AgentHelloPhone.html" class="dl-btn primary" data-action="create-agent">Create</a></footer>
</section>
</div>
</body>
</html>
