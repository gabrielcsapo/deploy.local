<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-board" content="width=390,height=844">
<title>iPhone — Work: your agent conversations</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.dl-phone .dl-item .dl-t > span{white-space:normal}.dl-phone .dl-section-sub,.dl-phone .dl-meta{font-size:13px;line-height:18px}
</style>
</head>
<body>
<div data-layer="phone" class="dl-phone"><header data-layer="ph-top" class="dl-ph-top"><span data-layer="span" style="width: 44px"></span><span data-layer="t" class="dl-t"></span><a data-layer="new-task" href="Home.html" class="dl-ph-btn" aria-label="New task"><svg data-layer="svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a></header><div data-layer="work" class="dl-ph-large">Work</div><div data-layer="ph-body" class="dl-ph-body">
<div data-layer="agents-header" class="dl-ph-label" style="display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0 32px"><span data-layer="agents">Agents</span><a data-layer="new-agent" href="NewAgentPhone.html" class="dl-ph-btn" aria-label="New agent"><svg data-layer="svg-9" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></div>
<div data-layer="ph-group" class="dl-ph-group"><a data-layer="ph-row" href="AgentPhone.html" class="dl-ph-row"><span data-layer="r" class="dl-glyph lg">R</span><span data-layer="t-2" class="dl-t"><span data-layer="release-notes-writer">Release notes writer</span><span data-layer="only-when-you">I’ll draft a first pass.</span></span><time data-layer="now" class="dl-c">now</time></a></div>
<div data-layer="ph-label" class="dl-ph-label" style="display:flex;justify-content:space-between"><span data-layer="waiting-on-you">Waiting on you · 0</span><a data-layer="answered" href="AnsweredPhone.html" style="color:var(--ink)">Answered</a></div>
<div data-layer="div" style="padding:4px 20px 8px;display:flex;flex-direction:column;gap:4px"><span data-layer="nothing-waiting" style="font-size:15px;line-height:24px;font-weight:600;color:var(--ink)">Nothing waiting</span><span data-layer="decisions-from-your" style="font-size:13px;line-height:20px;color:var(--ink-soft)">Decisions from your tasks and agents appear here.</span></div>
<div data-layer="today" class="dl-ph-label">Today</div>
<div data-layer="ph-group-2" class="dl-ph-group"><a data-layer="ph-row-2" href="RunTaskPhone.html" class="dl-ph-row"><svg data-layer="running" class="dl-run" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Running"><path d="M12 3a9 9 0 1 0 9 9"/></svg><span data-layer="t-3" class="dl-t"><span data-layer="release-notes-writer-2">Draft this week’s release notes</span><span data-layer="running-ser">Release notes writer · SER</span></span><span data-layer="1m" class="dl-c">1m</span></a></div>
</div><div data-layer="ph-composer" class="dl-ph-composer"><a data-layer="attach" href="AttachPhone.html" class="dl-ph-btn" style="width:32px;height:32px;margin-left:-8px" aria-label="Attach"><svg data-layer="svg-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a><span data-layer="ask-build-or" class="dl-grow">Ask, build, or follow up…</span><span data-layer="send" class="dl-send" aria-hidden="true"><svg data-layer="svg-3" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></div><nav data-layer="places" class="dl-tabbar" aria-label="Places"><a data-layer="on" href="WorkAgentsPhone.html" class="on" aria-current="page"><svg data-layer="svg-4" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Work</a><a data-layer="a" href="ProjectPhone.html"><svg data-layer="svg-5" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects</a><a data-layer="a-2" href="LivePhone.html"><svg data-layer="svg-6" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Live</a><a data-layer="a-3" href="ComputePhone.html"><svg data-layer="svg-7" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Computers</a><a data-layer="a-4" href="SettingsPhone.html"><svg data-layer="svg-8" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a></nav></div>
</body>
</html>
