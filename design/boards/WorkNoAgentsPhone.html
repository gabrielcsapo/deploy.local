<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<meta name="design-board" content="width=390,height=844">
<title>iPhone — Work before the first agent</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:var(--paper)}
.dl-phone .dl-item .dl-t > span{white-space:normal}.dl-phone .dl-section-sub,.dl-phone .dl-meta{font-size:13px;line-height:18px}

/* Board-local avatar studies, derived from the design-system hues. */
.agent-avatar{display:inline-flex;align-items:center;justify-content:center;flex:none;width:28px;height:28px;border-radius:var(--radius-full);overflow:hidden;vertical-align:middle}
.agent-avatar svg{display:block;width:100%;height:100%}.agent-avatar.hero{width:88px;height:88px}.agent-avatar.large{width:64px;height:64px}
.dl-nav .dl-lead:has(.agent-avatar){width:28px}.dl-nav:has(.agent-avatar){gap:10px}
.agent-identity{display:flex;align-items:center;gap:10px;min-width:0;min-height:44px;color:var(--ink)}
.agent-identity .dl-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar-edit{display:flex;flex-direction:column;align-items:center;gap:4px}.avatar-edit a{display:inline-flex;flex-direction:column;align-items:center;gap:8px;min-height:44px}.avatar-edit .dl-btn{min-height:44px}
.avatar-colors{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:0;width:100%;max-width:360px;margin:4px auto}
.color-choice{border:0;background:transparent;min-width:0;height:44px;padding:4px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.color-choice span{width:22px;height:22px;display:block;border-radius:50%;background:var(--swatch);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 18%,transparent)}
.color-choice[aria-pressed="true"] span{outline:2px solid var(--ink);outline-offset:3px}
.avatar-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.avatar-choice{display:flex;align-items:center;justify-content:center;min-height:76px;border:1px solid var(--line);border-radius:var(--radius-card);background:var(--paper)}.avatar-choice[aria-pressed="true"]{border:2px solid var(--ink)}
.agent-modal-layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:color-mix(in srgb,var(--ink) 22%,transparent);box-sizing:border-box}
.agent-modal{max-width:420px;max-height:calc(100dvh - 48px);overflow-y:auto;padding:24px;gap:20px}.agent-modal .dl-dialog-head h2{font-size:22px;line-height:28px}
.agent-modal .dl-field{height:44px;font-size:15px}.agent-modal .dl-dialog-foot .dl-btn{min-width:88px;height:44px}
.agent-form{display:flex;flex-direction:column;gap:8px}.agent-form label{font-size:13px;line-height:20px;font-weight:500}.agent-form .dl-field{height:44px}.agent-form .dl-textarea{font:inherit;line-height:24px;resize:vertical}
.agent-section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.agent-section-head .dl-btn{min-height:44px}
.agent-details .dl-section{gap:8px}.agent-details .dl-setting{flex-wrap:wrap}.agent-details .dl-setting .dl-v{max-width:100%}
.agent-greeting{gap:12px;padding:56px 0 28px}.agent-greeting h3{font-size:22px;line-height:28px}.agent-greeting p{font-size:15px;line-height:24px;max-width:440px}
.first-messages{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;max-width:620px}.first-message{border:1px solid var(--line-strong);border-radius:var(--radius-control);background:var(--surface);padding:10px 14px;min-height:44px;font:inherit;font-size:13px;line-height:20px;cursor:pointer;text-align:left}
:where(button,a,input,textarea,select):focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.dl-phone .agent-avatar{width:32px;height:32px}.dl-phone .agent-avatar.hero{width:88px;height:88px}.dl-phone .agent-avatar.large{width:64px;height:64px}
.dl-phone .avatar-colors{grid-template-columns:repeat(5,44px);justify-content:center;gap:0 10px;max-width:100%}
.dl-phone .avatar-edit .dl-btn{width:auto}.dl-phone .agent-form .dl-field,.dl-phone .agent-form .dl-textarea{font-size:17px}
.dl-phone .agent-greeting{padding:32px 20px 20px}.dl-phone .agent-greeting p{font-size:17px;line-height:24px}
.dl-phone .first-messages{margin-top:12px;gap:8px;width:100%}.dl-phone .first-message{width:100%;font-size:15px;line-height:20px}
.dl-phone .agent-section-head .dl-btn{width:auto;font-size:15px}.dl-phone .agent-form{padding:0 20px}.dl-phone .agent-form label{font-size:13px}
.dl-phone .agent-identity{justify-content:center;gap:8px}.dl-phone .agent-identity .agent-avatar{width:28px;height:28px}.dl-phone .agent-identity span{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:820px){.agent-modal-layer{padding:16px}.agent-modal{max-height:calc(100dvh - 32px)}}

</style>
</head>
<body>
<div data-layer="phone" class="dl-phone"><header data-layer="ph-top" class="dl-ph-top"><span data-layer="span" style="width: 44px"></span><span data-layer="t" class="dl-t"></span><a data-layer="new-task" href="Home.html" class="dl-ph-btn" aria-label="New task"><svg data-layer="svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a></header><div data-layer="work" class="dl-ph-large">Work</div><div data-layer="ph-body" class="dl-ph-body">
<div data-layer="agents-header" class="dl-ph-label" style="display:flex;align-items:center;justify-content:space-between;padding:8px 20px 0 32px"><span data-layer="agents">Agents</span><a data-layer="new-agent" href="NewAgentBlankPhone.html" class="dl-ph-btn" aria-label="New agent"><svg data-layer="svg-9" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a></div>
<p data-layer="no-agents-yet" class="dl-meta" style="margin:4px 32px 8px;font-size:13px;line-height:18px">Give it a name. Teach it in the chat.</p>
<div data-layer="ph-label" class="dl-ph-label" style="display:flex;justify-content:space-between"><span data-layer="waiting-on-you">Waiting on you · 0</span><a data-layer="answered" href="AnsweredPhone.html" style="color:var(--ink)">Answered</a></div>
<div data-layer="div" style="padding:4px 20px 8px;display:flex;flex-direction:column;gap:4px"><span data-layer="nothing-waiting" style="font-size:15px;line-height:24px;font-weight:600;color:var(--ink)">Nothing waiting</span><span data-layer="decisions-from-your" style="font-size:13px;line-height:20px;color:var(--ink-soft)">Decisions from your tasks and agents appear here.</span></div>
</div><div data-layer="ph-composer" class="dl-ph-composer"><a data-layer="attach" href="AttachPhone.html" class="dl-ph-btn" style="width:32px;height:32px;margin-left:-8px" aria-label="Attach"><svg data-layer="svg-2" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a><span data-layer="ask-build-or" class="dl-grow">Ask, build, or follow up…</span><span data-layer="send" class="dl-send" aria-hidden="true"><svg data-layer="svg-3" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span></div><nav data-layer="places" class="dl-tabbar" aria-label="Places"><a data-layer="on" href="WorkNoAgentsPhone.html" class="on" aria-current="page"><svg data-layer="svg-4" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Work</a><a data-layer="a" href="ProjectPhone.html"><svg data-layer="svg-5" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projects</a><a data-layer="a-2" href="LivePhone.html"><svg data-layer="svg-6" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>Live</a><a data-layer="a-3" href="ComputePhone.html"><svg data-layer="svg-7" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Computers</a><a data-layer="a-4" href="SettingsPhone.html"><svg data-layer="svg-8" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Settings</a></nav></div>
</body>
</html>
