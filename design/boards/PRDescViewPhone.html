<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design-board" content="width=390,height=844">
<title>iPhone: a description with its files</title>
<link rel="stylesheet" href="../ds/deploy-local/tokens.css">
<link rel="stylesheet" href="../ds/deploy-local/components/bundle.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#fafafb}
.ba{position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:5;font:600 11px/16px 'Hanken Grotesk',system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:2px 10px;border-radius:0 0 6px 6px;color:#fff}
.ba.before{background:#6b6b76}.ba.after{background:#18181b}
.desc{border:1px solid var(--line);border-radius:12px;background:var(--surface,#fff)}
.desc-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.desc-head .t{font-weight:600;font-size:13px}
.desc-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:24px}
.desc-body h3{margin:4px 0 0;font-size:15px;line-height:22px}
.desc-body p,.desc-body ul{margin:0}.desc-body ul{padding-left:20px}
.md{font:13px/20px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);white-space:pre-wrap;margin:0;padding:14px;min-height:150px}
.drop{position:relative;margin:0 12px 12px;border:1.5px dashed #3b82f6;border-radius:10px;background:rgba(59,130,246,.06);display:flex;align-items:center;justify-content:center;gap:8px;height:64px;color:#1d4ed8;font-size:13px;font-weight:500}
.ghost{position:absolute;right:28px;top:-34px;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:12px;color:var(--ink);transform:rotate(-3deg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.upl{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}
.upl .bar{width:64px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}.upl .bar i{display:block;height:100%;background:#18181b}
.desc-foot{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.shot{border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.shot .mock{background:#fafafb;height:220px;display:flex}
.shot .mock .s{width:150px;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.shot .mock .s i,.shot .mock .m i{display:block;height:8px;border-radius:4px;background:#e4e4e8}
.shot .mock .m{flex:1;padding:16px;display:flex;flex-direction:column;gap:10px}
.shot .cap{display:flex;gap:8px;align-items:center;padding:8px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:#fff}
.banner{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:#fff7e6;color:#8a5a00;font-size:12px;font-weight:600}
.video{border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#111114;height:200px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff}
.video .ctl{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:12px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.video .ctl .tl{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
.video .pb{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center}
.fcard{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.fcard .ic{width:36px;height:44px;border-radius:6px;background:#f1f1f4;display:flex;align-items:center;justify-content:center;flex:none;color:var(--muted)}
.fcard .t{flex:1;display:flex;flex-direction:column;font-size:13px;line-height:18px}.fcard .t span+span{color:var(--muted);font-size:12px}
.logb{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.logb .h{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;border-bottom:1px solid var(--line);background:#fff}
.logb pre{margin:0;padding:10px 12px;font:12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f6f6f8;color:#3f3f46}
.desc-body code{font:13px/20px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f1f4;border-radius:4px;padding:1px 4px}
.pdfp{display:flex;gap:6px}.pdfp span{width:44px;height:58px;border-radius:4px;background:#fff;box-shadow:0 0 0 1px var(--line);display:block;padding:6px;box-sizing:border-box}
.pdfp span i{display:block;height:3px;margin:3px 0;background:#e4e4e8;border-radius:2px}
</style>
</head>
<body>
<div data-layer="div" style="position:relative;width:390px;height:844px;overflow:hidden"><div data-layer="phone" class="dl-phone"><header data-layer="ph-top" class="dl-ph-top"><a data-layer="back" href="HomePhone.html" class="dl-ph-btn" aria-label="Back"><svg data-layer="svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><span data-layer="t" class="dl-t"><a data-layer="a" href="TaskInfoPhone.html" style="display:flex;flex-direction:column;align-items:center;line-height:1.2"><span data-layer="self-release-pipeline">Self-release pipeline</span><span data-layer="pr-18-open" style="font-size:12px;line-height:16px;font-weight:400;color:var(--muted)">PR #18 · open ›</span></a></span><button data-layer="more" type="button" class="dl-ph-btn" aria-label="More"><svg data-layer="svg-2" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button></header><div data-layer="ph-body" class="dl-ph-body">
<div data-layer="seg" class="dl-seg" style="display:flex;margin:0 16px 4px"><a data-layer="chat" href="#" style="flex:1;justify-content:center">Chat</a><a data-layer="changes-4" href="#" class="on" style="flex:1;justify-content:center">Changes 4</a><a data-layer="checks" href="#" style="flex:1;justify-content:center">Checks</a></div>
<div data-layer="description" class="dl-ph-label" style="display:flex;align-items:center">Description<span data-layer="edit" style="margin-left:auto;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0">Edit</span></div>
<div data-layer="desc-body" class="desc-body" style="padding:0 16px">
<p data-layer="releases-now-roll">Releases now roll back on their own when the new version fails its health check.</p>
<figure data-layer="shot" class="shot" style="margin:0"><div data-layer="mock" class="mock" style="height:150px"><div data-layer="m" class="m"><div data-layer="automatically-rolled-bac" class="banner">Automatically rolled back</div><i data-layer="i" style="width:40%"></i><i data-layer="i-2"></i><i data-layer="i-3" style="width:70%"></i></div></div><figcaption data-layer="cap" class="cap"><svg data-layer="svg-3" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>The Releases page after a rollback</figcaption></figure>
<div data-layer="video" class="video" style="height:150px"><span data-layer="pb" class="pb"><svg data-layer="svg-4" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg></span><div data-layer="ctl" class="ctl"><span data-layer="0-42">0:42</span><span data-layer="tl" class="tl"></span></div></div>
<div data-layer="fcard" class="fcard"><span data-layer="ic" class="ic"><svg data-layer="svg-5" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span><span data-layer="t-2" class="t"><span data-layer="rollback-log">rollback.log</span><span data-layer="86-lines-4">86 lines · 4 KB</span></span><svg data-layer="svg-6" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
<div data-layer="fcard-2" class="fcard"><span data-layer="ic-2" class="ic"><svg data-layer="svg-7" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg></span><span data-layer="t-3" class="t"><span data-layer="ser-release-zip">ser-release.zip</span><span data-layer="zip-2-1">Zip · 2.1 MB</span></span><svg data-layer="svg-8" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M5 20h14"/></svg></div>
</div>
</div></div>
</div>
</body>
</html>
