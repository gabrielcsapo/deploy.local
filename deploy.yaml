apiVersion: deploy.local/v1
kind: Application
pipeline:
  on: [push, pull_request, manual]
  branches: [main]
  jobs:
    typecheck:
      runsOn: { os: linux, capabilities: [node] }
      container: node:26-trixie
      run: sh scripts/ci-setup.sh && pnpm install --frozen-lockfile && pnpm run typecheck
      timeoutSeconds: 900
    lint:
      runsOn: { os: linux, capabilities: [node] }
      container: node:26-trixie
      run: sh scripts/ci-setup.sh && pnpm install --frozen-lockfile && pnpm run lint && pnpm run format:check
      timeoutSeconds: 900
    test:
      runsOn: { os: linux, capabilities: [node] }
      container: node:26-trixie
      run: sh scripts/ci-setup.sh && pnpm install --frozen-lockfile && DEPLOY_SKIP_SWIFT_TESTS=1 DEPLOY_MDNS_ADDRESS=127.0.0.1 sh scripts/ci-test.sh
      timeoutSeconds: 3600
    build:
      runsOn: { os: linux, capabilities: [node] }
      container: node:26-trixie
      run: sh scripts/ci-setup.sh && pnpm install --frozen-lockfile && pnpm run build
      timeoutSeconds: 1800
