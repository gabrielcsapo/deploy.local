<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="design-board"
      content="platform=print,size=148x105mm,bleed=3mm,safe=5mm,schemes=light"
    />
    <title>Example postcard back</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/print.css" />
  </head>
  <body>
    <div
      class="ds-print-face ds-print-back"
      data-layer="back"
      style="--print-w: 148mm; --print-h: 105mm; --print-bleed: 3mm; --print-safe: 5mm"
    >
      <div class="ds-print-safe" data-layer="back-content">
        <div class="ds-print-back-message" data-layer="message">
          <p class="ds-print-body" data-layer="message-text">
            Thank you for coming on Saturday. Everything we talked about is in the folder I sent,
            and the first copies go out next week. Alex
          </p>
          <div class="ds-print-lines" data-layer="message-lines"></div>
          <div class="ds-print-wordmark" data-layer="wordmark">
            <svg viewBox="0 0 64 64" aria-hidden="true">
              <path
                fill-rule="evenodd"
                fill="currentColor"
                d="M14 0h36a14 14 0 0 1 14 14v36a14 14 0 0 1-14 14H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0zM32 14a18 18 0 1 0 0 36 18 18 0 0 0 0-36z"
              />
              <circle cx="32" cy="32" r="8" fill="currentColor" />
            </svg>
            __NAME__
          </div>
        </div>
        <div class="ds-print-back-side" data-layer="side">
          <div class="ds-print-stamp" data-layer="stamp">Stamp</div>
          <address class="ds-print-address ruled" data-layer="address">
            <span class="line">Sam Rivera</span>
            <span class="line">24 Example Road</span>
            <span class="line">Springfield, IL 62701</span>
            <span class="line">United States</span>
          </address>
        </div>
      </div>
    </div>
  </body>
</html>
