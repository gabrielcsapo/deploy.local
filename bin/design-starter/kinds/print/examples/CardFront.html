<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="design-board"
      content="platform=print,size=85x55mm,bleed=3mm,safe=4mm,schemes=light"
    />
    <title>Example card front</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/print.css" />
  </head>
  <body>
    <div
      class="ds-print-face ground-quiet"
      data-layer="front"
      style="--print-w: 85mm; --print-h: 55mm; --print-bleed: 3mm; --print-safe: 4mm"
    >
      <div class="ds-print-safe" data-layer="front-content">
        <div data-layer="person" data-question="Whose card is this, and what is their role?">
          <p class="ds-print-name">Ines Moreau</p>
          <p class="ds-print-small ds-print-muted">Head of studio, __NAME__</p>
        </div>
        <div
          class="ds-print-contact"
          data-layer="contact"
          data-question="Are these the real email, phone number and website?"
        >
          <span>ines@example.com</span>
          <span>+33 4 78 21 56 09</span>
          <span>example.com</span>
        </div>
      </div>
    </div>
  </body>
</html>
