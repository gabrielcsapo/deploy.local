<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="design-board"
      content="platform=print,size=148x105mm,bleed=3mm,safe=5mm,schemes=light"
    />
    <title>Example postcard front</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/print.css" />
  </head>
  <body>
    <div
      class="ds-print-face ground-brand"
      data-layer="front"
      style="--print-w: 148mm; --print-h: 105mm; --print-bleed: 3mm; --print-safe: 5mm"
    >
      <div class="ds-print-safe" data-layer="front-content">
        <div class="ds-print-wordmark" data-layer="wordmark">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path
              fill-rule="evenodd"
              fill="currentColor"
              d="M14 0h36a14 14 0 0 1 14 14v36a14 14 0 0 1-14 14H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0zM32 14a18 18 0 1 0 0 36 18 18 0 0 0 0-36z"
            />
            <circle cx="32" cy="32" r="8" fill="currentColor" />
          </svg>
          __NAME__
        </div>
        <div data-layer="headline">
          <p class="ds-print-display" data-layer="headline-text">Swim first, breakfast after</p>
          <p
            class="ds-print-body lead"
            data-layer="hours"
            data-question="Are these the real opening days and hours?"
          >
            On the north shore, open daily 7 am to 3 pm from June to September.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
