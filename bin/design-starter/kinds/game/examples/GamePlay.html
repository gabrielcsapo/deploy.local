<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=game,device=phone,schemes=light dark" />
    <title>Example in-play HUD</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/game.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="ds-game">
      <div class="ds-game-hud"><button type="button" class="ds-game-btn small" aria-label="Pause"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button><span class="grow">Level 6</span><span class="ds-game-pips" aria-label="Lives"><i></i><i></i><i class="off"></i></span></div>
      <div class="ds-game-stage">
        <svg viewBox="0 0 358 600" width="100%" height="100%" aria-hidden="true">
          <circle cx="90" cy="120" r="22" fill="var(--ink-tertiary)"/>
          <circle cx="250" cy="190" r="22" fill="var(--ink-tertiary)"/>
          <circle cx="160" cy="290" r="22" fill="var(--ink-tertiary)"/>
          <rect x="60" y="420" width="238" height="14" rx="7" fill="var(--ink)"/>
          <circle cx="179" cy="396" r="14" fill="var(--accent)"/>
        </svg>
        <div class="ds-game-score" style="position: absolute; left: 0; right: 0; top: 20px; text-align: center">1,240</div>
      </div>
      <div class="ds-game-controls">
        <button type="button" class="ds-game-btn" aria-label="Left"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></button>
        <button type="button" class="ds-game-btn primary" aria-label="Jump"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg></button>
        <button type="button" class="ds-game-btn" aria-label="Right"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg></button>
      </div>
    </div>
  </body>
</html>
