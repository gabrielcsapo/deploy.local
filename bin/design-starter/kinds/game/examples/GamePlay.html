<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=game,device=phone,width=390,height=844,schemes=light dark" />
    <title>Example in-play HUD</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/game.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="ds-game" data-layer="screen">
      <div class="ds-game-status" data-layer="status-bar" aria-hidden="true"><span class="time">9:41</span><span class="glyphs"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 28 13"><rect x="0.5" y="0.5" width="24" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="21" height="9" rx="2.5"/><rect x="26" y="4.5" width="2" height="4" rx="1" opacity=".5"/></svg></span></div>
      <div class="ds-game-hud"><button type="button" class="ds-game-btn small" aria-label="Pause"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg></button><span class="grow">Level name</span><span class="ds-game-pips" aria-label="Lives"><i></i><i></i><i class="off"></i></span></div>
      <div class="ds-game-stage">
        <svg viewBox="0 0 358 600" width="100%" height="100%" aria-hidden="true">
          <circle cx="90" cy="120" r="22" fill="var(--ink-tertiary)"/>
          <circle cx="250" cy="190" r="22" fill="var(--ink-tertiary)"/>
          <circle cx="160" cy="290" r="22" fill="var(--ink-tertiary)"/>
          <rect x="60" y="420" width="238" height="14" rx="7" fill="var(--ink)"/>
          <circle cx="179" cy="396" r="14" fill="var(--accent)"/>
        </svg>
        <div class="ds-game-score" data-layer="score" data-question="What does the player score, and how is it shown?" style="position: absolute; left: 0; right: 0; top: 20px; text-align: center">000</div>
      </div>
      <div class="ds-game-controls">
        <div class="ds-game-control"><button type="button" class="ds-game-btn" aria-label="Left"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></button><span class="ds-game-label">Left</span></div>
        <div class="ds-game-control"><button type="button" class="ds-game-btn primary" aria-label="Jump"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6"/></svg></button><span class="ds-game-label">Jump</span></div>
        <div class="ds-game-control"><button type="button" class="ds-game-btn" aria-label="Right"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6l6 6-6 6"/></svg></button><span class="ds-game-label">Right</span></div>
      </div>
      <div class="ds-game-home" data-layer="home-indicator" aria-hidden="true"></div>
    </div>
  </body>
</html>
