<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=game,device=phone,width=390,height=844,schemes=light dark" />
    <title>Example level select</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/game.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="ds-game" data-layer="screen">
      <div class="ds-game-status" data-layer="status-bar" aria-hidden="true"><span class="time">9:41</span><span class="glyphs"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 28 13"><rect x="0.5" y="0.5" width="24" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="21" height="9" rx="2.5"/><rect x="26" y="4.5" width="2" height="4" rx="1" opacity=".5"/></svg></span></div>
      <div class="ds-game-hud"><button type="button" class="ds-game-btn small" aria-label="Back"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg></button><span class="grow">World name</span></div>
      <div class="ds-game-heading"><h1 class="ds-game-title">Choose a level</h1><p class="ds-game-label" data-layer="progress-caption" data-question="How many levels are there, and how many are done?">Levels done of all levels</p></div>
      <div class="ds-game-grid"><div class="ds-game-tile done">1<svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="ds-game-tile done">2<svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="ds-game-tile done">3<svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="ds-game-tile done">4<svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="ds-game-tile done">5<svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="ds-game-tile available">6</div><div class="ds-game-tile locked"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg></div><div class="ds-game-tile locked"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg></div><div class="ds-game-tile locked"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg></div><div class="ds-game-tile locked"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg></div><div class="ds-game-tile locked"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg></div><div class="ds-game-tile locked"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z"/></svg></div></div>
      <div class="ds-game-home" data-layer="home-indicator" aria-hidden="true"></div>
    </div>
  </body>
</html>
