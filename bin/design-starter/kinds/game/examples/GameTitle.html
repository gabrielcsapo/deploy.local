<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=game,device=phone,width=390,height=844,schemes=light dark" />
    <title>Example game title</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/game.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <div class="ds-game" data-layer="screen">
      <div class="ds-game-status" data-layer="status-bar" aria-hidden="true"><span class="time">9:41</span><span class="glyphs"><svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg viewBox="0 0 28 13"><rect x="0.5" y="0.5" width="24" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="21" height="9" rx="2.5"/><rect x="26" y="4.5" width="2" height="4" rx="1" opacity=".5"/></svg></span></div>
      <div class="ds-game-hud"><button type="button" class="ds-game-btn small" aria-label="Close"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span class="grow"></span><button type="button" class="ds-game-btn small" aria-label="Sound"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10zM16.5 9a4 4 0 0 1 0 6"/></svg></button></div>
      <div class="ds-game-center">
        <svg width="72" height="72" viewBox="0 0 64 64" aria-hidden="true"><path fill-rule="evenodd" fill="currentColor" d="M14 0h36a14 14 0 0 1 14 14v36a14 14 0 0 1-14 14H14A14 14 0 0 1 0 50V14A14 14 0 0 1 14 0zM32 14a18 18 0 1 0 0 36 18 18 0 0 0 0-36z"/><circle cx="32" cy="32" r="8" fill="var(--accent)"/></svg>
        <h1 class="ds-game-display">Game name</h1>
        <p class="ds-game-label" data-layer="best-score" data-question="Does the game keep a best score, and is it shown here?">Best score</p>
      </div>
      <div class="ds-game-actions">
        <button type="button" class="ds-game-play" style="border: 0"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>Play</button>
        <button type="button" class="ds-game-play secondary">Levels</button>
      </div>
      <div class="ds-game-home" data-layer="home-indicator" aria-hidden="true"></div>
    </div>
  </body>
</html>
