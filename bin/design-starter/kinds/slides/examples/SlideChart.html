<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example chart slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <section class="ds-slide" data-layer="slide">
      <div class="ds-slide-eyebrow">Results</div>
      <h2 class="ds-slide-heading">Most of the gain came from one place</h2>
      <div
        class="ds-slide-bars"
        data-layer="bars"
        data-question="What are the real values behind these bars?"
      >
        <div class="ds-slide-bar">
          <span>Group one</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 38"></div>
          </div>
          <span class="ds-slide-bar-value">38</span>
        </div>
        <div class="ds-slide-bar focus">
          <span>Group two</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 92"></div>
          </div>
          <span class="ds-slide-bar-value">92</span>
        </div>
        <div class="ds-slide-bar">
          <span>Group three</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 54"></div>
          </div>
          <span class="ds-slide-bar-value">54</span>
        </div>
        <div class="ds-slide-bar">
          <span>Group four</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 21"></div>
          </div>
          <span class="ds-slide-bar-value">21</span>
        </div>
      </div>
      <aside data-notes>Group two is the point. The others are context.</aside>
      <div class="ds-slide-foot"><span>Deck name</span><span>3</span></div>
    </section>
  </body>
</html>
