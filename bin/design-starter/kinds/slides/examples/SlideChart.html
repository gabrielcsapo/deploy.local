<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example chart slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide" data-layer="slide">
      <div class="ds-slide-eyebrow">Results</div>
      <h2 class="ds-slide-heading">Most of the time went to building</h2>
      <div
        class="ds-slide-bars"
        data-layer="bars"
        data-question="Are these the real hours per part?"
      >
        <div class="ds-slide-bar focus">
          <span>Building</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 100"></div>
          </div>
          <span class="ds-slide-bar-value">104</span>
        </div>
        <div class="ds-slide-bar">
          <span>Planning</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 38"></div>
          </div>
          <span class="ds-slide-bar-value">40</span>
        </div>
        <div class="ds-slide-bar">
          <span>Testing</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 35"></div>
          </div>
          <span class="ds-slide-bar-value">36</span>
        </div>
        <div class="ds-slide-bar">
          <span>Writing</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 19"></div>
          </div>
          <span class="ds-slide-bar-value">20</span>
        </div>
      </div>
      <aside data-notes>
        Building is the point. The four add up to the 200 hours on the figures slide.
      </aside>
      <div class="ds-slide-foot">
        <span data-layer="deck-name" data-deck-name>__NAME__</span
        ><span class="ds-slide-foot-num" data-layer="slide-number" data-slide-number>3</span>
      </div>
    </section>
  </body>
</html>
