<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example chart slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide" data-layer="slide">
      <div class="ds-slide-eyebrow">Results</div>
      <h2 class="ds-slide-heading">Most of the harvest came from the tomato beds</h2>
      <div
        class="ds-slide-bars"
        data-layer="bars"
        data-question="Are these the real weights per crop, in kg?"
      >
        <div class="ds-slide-bar focus">
          <span>Tomatoes</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 100"></div>
          </div>
          <span class="ds-slide-bar-value">520</span>
        </div>
        <div class="ds-slide-bar">
          <span>Squash</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 60"></div>
          </div>
          <span class="ds-slide-bar-value">310</span>
        </div>
        <div class="ds-slide-bar">
          <span>Beans</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 46"></div>
          </div>
          <span class="ds-slide-bar-value">240</span>
        </div>
        <div class="ds-slide-bar">
          <span>Greens</span>
          <div class="ds-slide-bar-track">
            <div class="ds-slide-bar-fill" style="--v: 33"></div>
          </div>
          <span class="ds-slide-bar-value">170</span>
        </div>
      </div>
      <aside data-notes>
        Tomatoes are the point. The four add up to the 1,240 kg on the figures slide.
      </aside>
      <div class="ds-slide-foot">
        <span data-layer="deck-name" data-deck-name>__NAME__</span
        ><span class="ds-slide-foot-num" data-layer="slide-number" data-slide-number>3</span>
      </div>
    </section>
  </body>
</html>
