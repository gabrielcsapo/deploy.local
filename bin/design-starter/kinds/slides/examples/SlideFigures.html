<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example figures slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <section class="ds-slide figures" data-layer="slide">
      <div class="ds-slide-eyebrow" data-layer="eyebrow">The year</div>
      <h2 class="ds-slide-heading" data-layer="heading">The year in three numbers</h2>
      <div
        class="ds-slide-figures n3"
        data-layer="figures"
        data-question="What are the three figures, and what does each count?"
      >
        <div class="ds-slide-figure" data-layer="figure-1">
          <div class="value">00</div>
          <div class="label">What the first figure counts</div>
        </div>
        <div class="ds-slide-figure focus" data-layer="figure-2">
          <div class="value">00</div>
          <div class="label">What the second figure counts</div>
        </div>
        <div class="ds-slide-figure" data-layer="figure-3">
          <div class="value">00</div>
          <div class="label">What the third figure counts</div>
        </div>
      </div>
      <aside data-notes>
        Say each figure aloud, then stop. Take the numbers from the brief; if it has none, ask.
      </aside>
      <div class="ds-slide-foot"><span>Deck name</span><span>4</span></div>
    </section>
  </body>
</html>
