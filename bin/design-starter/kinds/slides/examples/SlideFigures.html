<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example figures slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide figures" data-layer="slide">
      <div class="ds-slide-eyebrow" data-layer="eyebrow">This season</div>
      <h2 class="ds-slide-heading" data-layer="heading">The season in three numbers</h2>
      <div
        class="ds-slide-figures n3"
        data-layer="figures"
        data-question="Are these the real figures?"
      >
        <div class="ds-slide-figure" data-layer="figure-1">
          <div class="value">38</div>
          <div class="label">Active members</div>
          <div class="context">Up from 31 last spring</div>
        </div>
        <div class="ds-slide-figure focus" data-layer="figure-2">
          <div class="value">1,240<span class="unit">kg</span></div>
          <div class="label">Harvested this season</div>
          <div class="context">Most of it given away</div>
        </div>
        <div class="ds-slide-figure" data-layer="figure-3">
          <div class="value">12<span class="unit">weeks</span></div>
          <div class="label">Open to everyone</div>
          <div class="context">May to August</div>
        </div>
      </div>
      <aside data-notes>
        Say each figure aloud, then stop. The numbers are drawn plausibly and flagged; replace them
        with the brief's.
      </aside>
      <div class="ds-slide-foot">
        <span data-layer="deck-name" data-deck-name>__NAME__</span
        ><span class="ds-slide-foot-num" data-layer="slide-number" data-slide-number>6</span>
      </div>
    </section>
  </body>
</html>
