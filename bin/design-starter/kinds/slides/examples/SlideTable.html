<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example table slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide" data-layer="slide">
      <div class="ds-slide-eyebrow">By part</div>
      <h2 class="ds-slide-heading">Building took half of the hours</h2>
      <table
        class="ds-slide-table"
        data-layer="table"
        data-question="Are these the real hours per part?"
      >
        <thead>
          <tr>
            <th>Part</th>
            <th>Who</th>
            <th class="num">Hours</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Planning</td>
            <td>Everyone</td>
            <td class="num">40</td>
          </tr>
          <tr>
            <td>Building</td>
            <td>Two people</td>
            <td class="num">104</td>
          </tr>
          <tr>
            <td>Testing and writing</td>
            <td>One person each</td>
            <td class="num">56</td>
          </tr>
        </tbody>
        <tfoot>
          <tr class="total">
            <td>Total</td>
            <td></td>
            <td class="num">200</td>
          </tr>
        </tfoot>
      </table>
      <aside data-notes>
        The total matches the figures slide. Ask each person to check their own row.
      </aside>
      <div class="ds-slide-foot">
        <span data-layer="deck-name" data-deck-name>__NAME__</span
        ><span class="ds-slide-foot-num" data-layer="slide-number" data-slide-number>5</span>
      </div>
    </section>
  </body>
</html>
