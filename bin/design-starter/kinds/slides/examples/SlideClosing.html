<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example closing slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <section class="ds-slide closing" data-layer="slide">
      <h2 class="ds-slide-display" data-layer="closing-line">Thank you</h2>
      <div class="ds-slide-next n3" data-layer="next" data-question="Where can people find the deck, who do they ask, and what happens next?">
        <div data-layer="next-find"><span class="label">Find it</span><span class="value">Where the deck lives</span></div>
        <div data-layer="next-ask"><span class="label">Ask</span><span class="value">Who answers questions</span></div>
        <div data-layer="next-after"><span class="label">Next</span><span class="value">What happens after today</span></div>
      </div>
      <aside data-notes>Stay on this slide for questions. It says where to carry on, so nobody asks you for the link.</aside>
    </section>
  </body>
</html>
