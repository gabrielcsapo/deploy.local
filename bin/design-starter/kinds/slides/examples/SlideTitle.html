<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example title slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide title" data-layer="slide">
      <div
        class="ds-slide-eyebrow"
        data-layer="occasion"
        data-question="Which meeting is this, and on what date?"
      >
        Project review
      </div>
      <h1 class="ds-slide-display">__NAME__: where it stands</h1>
      <p class="ds-slide-lede">What we did, where the time went, and what comes next.</p>
      <aside data-notes>Welcome everyone. Ten minutes, then questions.</aside>
    </section>
  </body>
</html>
