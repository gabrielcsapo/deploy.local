<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example title slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide title" data-layer="slide">
      <div class="ds-slide-eyebrow">Event or occasion</div>
      <h1 class="ds-slide-display">A plain title for the whole deck</h1>
      <p class="ds-slide-lede">One line that says what the next ten minutes are for.</p>
      <aside data-notes>Welcome everyone. Say who is speaking and how long this takes.</aside>
    </section>
  </body>
</html>
