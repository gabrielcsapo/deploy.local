<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example list slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg);
      }
    </style>
  </head>
  <body>
    <section class="ds-slide list">
      <div class="ds-slide-eyebrow">What we did</div>
      <h2 class="ds-slide-heading">Three things shipped</h2>
      <ol class="ds-slide-list" data-layer="items" data-question="Which items, and on what dates?">
        <li data-step="1"><span class="n">01</span>The first thing, in one line<span class="sub">First date</span></li>
        <li data-step="2"><span class="n">02</span>The second thing, in one line<span class="sub">Second date</span></li>
        <li data-step="3"><span class="n">03</span>The third thing, in one line<span class="sub">Third date</span></li>
      </ol>
      <aside data-notes>Take one item at a time; the dates, once the brief gives them, are for reference only.</aside>
      <div class="ds-slide-foot"><span>Deck name</span><span>2</span></div>
    </section>
  </body>
</html>
