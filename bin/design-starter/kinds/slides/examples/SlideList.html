<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example list slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide list">
      <div class="ds-slide-eyebrow">What we did</div>
      <h2 class="ds-slide-heading">Three things we built</h2>
      <ol
        class="ds-slide-list"
        data-layer="items"
        data-question="Are these the real projects and months?"
      >
        <li data-step="1">
          <span class="n">01</span>Raised beds along the east fence<span class="sub">April</span>
        </li>
        <li data-step="2">
          <span class="n">02</span>A tool shed with a sign-out sheet<span class="sub">June</span>
        </li>
        <li data-step="3">
          <span class="n">03</span>Drip watering on the long beds<span class="sub">July</span>
        </li>
      </ol>
      <aside data-notes>Take one at a time. The drip lines are the one people ask about.</aside>
      <div class="ds-slide-foot">
        <span data-layer="deck-name" data-deck-name>__NAME__</span
        ><span class="ds-slide-foot-num" data-layer="slide-number" data-slide-number>2</span>
      </div>
    </section>
  </body>
</html>
