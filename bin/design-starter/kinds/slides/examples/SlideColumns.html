<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=slide,width=1920,height=1080,schemes=light" />
    <title>Example column chart slide</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/slides.css" />
  </head>
  <body>
    <section class="ds-slide" data-layer="slide">
      <div class="ds-slide-eyebrow">Over the season</div>
      <h2 class="ds-slide-heading">The harvest peaked in August</h2>
      <div
        class="ds-slide-columns"
        data-layer="columns"
        data-question="Are these the real weights per month, in kg?"
      >
        <div class="ds-slide-column">
          <span class="ds-slide-column-value">40</span>
          <div class="ds-slide-column-track">
            <div class="ds-slide-column-fill" style="--v: 10"></div>
          </div>
          <span class="ds-slide-column-label">May</span>
        </div>
        <div class="ds-slide-column">
          <span class="ds-slide-column-value">160</span>
          <div class="ds-slide-column-track">
            <div class="ds-slide-column-fill" style="--v: 38"></div>
          </div>
          <span class="ds-slide-column-label">Jun</span>
        </div>
        <div class="ds-slide-column">
          <span class="ds-slide-column-value">380</span>
          <div class="ds-slide-column-track">
            <div class="ds-slide-column-fill" style="--v: 90"></div>
          </div>
          <span class="ds-slide-column-label">Jul</span>
        </div>
        <div class="ds-slide-column focus">
          <span class="ds-slide-column-value">420</span>
          <div class="ds-slide-column-track">
            <div class="ds-slide-column-fill" style="--v: 100"></div>
          </div>
          <span class="ds-slide-column-label">Aug</span>
        </div>
        <div class="ds-slide-column">
          <span class="ds-slide-column-value">240</span>
          <div class="ds-slide-column-track">
            <div class="ds-slide-column-fill" style="--v: 57"></div>
          </div>
          <span class="ds-slide-column-label">Sep</span>
        </div>
      </div>
      <aside data-notes>May to September, 1,240 kg in all. August alone was a third of it.</aside>
      <div class="ds-slide-foot">
        <span data-layer="deck-name" data-deck-name>__NAME__</span
        ><span class="ds-slide-foot-num" data-layer="slide-number" data-slide-number>4</span>
      </div>
    </section>
  </body>
</html>
