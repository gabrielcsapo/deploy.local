<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=mac,width=420,height=380,schemes=light dark" />
    <title>Example menu-bar extra</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/mac.css" />
  </head>
  <body>
    <div class="ds-mac-desk has-popover">
      <div class="ds-mac-menubar">
        <span class="app-name">Finder</span><span>File</span><span>Edit</span><span>View</span
        ><span class="grow"></span>
        <span class="extra on"
          ><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" /></svg></span
        ><span>Thu 9:41</span>
      </div>
      <div class="ds-mac-popover under-extra">
        <div class="ds-mac-popover-head">
          <span class="name">__NAME__</span
          ><span
            class="ds-mac-secondary end"
            data-layer="last-saved"
            data-question="Does the app sync, and what does it say about it?"
            >Synced 2 min ago</span
          >
        </div>
        <div class="ds-mac-menu-row on">New note<span class="value">Cmd N</span></div>
        <div class="ds-mac-menu-row">Open __NAME__<span class="value">Cmd O</span></div>
        <div class="ds-mac-menu-row">
          Plan for the first version<span class="value">Yesterday</span>
        </div>
        <div class="ds-mac-menu-row">Meeting notes, Monday<span class="value">Monday</span></div>
        <hr class="ds-mac-rule" />
        <div class="ds-mac-menu-row">Settings<span class="value">Cmd ,</span></div>
        <div class="ds-mac-menu-row">Quit<span class="value">Cmd Q</span></div>
      </div>
    </div>
  </body>
</html>
