<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=mac,width=420,height=380,schemes=light dark" />
    <title>Example menu-bar extra</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/mac.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg-sunken);
      }
    </style>
  </head>
  <body>
    <div class="ds-mac-desk has-popover">
      <div class="ds-mac-menubar">
        <span class="app-name">App</span><span>File</span><span>Edit</span><span>View</span><span class="grow"></span>
        <span class="extra on"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span>Clock</span>
      </div>
      <div class="ds-mac-popover under-extra">
        <div class="ds-mac-popover-head"><span class="name">Product name</span><span class="ds-mac-secondary" style="margin-left: auto">Status</span></div>
        <div class="ds-mac-menu-row on">First action<span class="value">Cmd O</span></div>
        <div class="ds-mac-menu-row">Second action</div>
        <div class="ds-mac-menu-row">Recent item<span class="value">Time</span></div>
        <div class="ds-mac-menu-row">Another recent item<span class="value">Time</span></div>
        <hr class="ds-mac-rule" />
        <div class="ds-mac-menu-row">Settings<span class="value">Cmd ,</span></div>
        <div class="ds-mac-menu-row">Quit<span class="value">Cmd Q</span></div>
      </div>
    </div>
  </body>
</html>
