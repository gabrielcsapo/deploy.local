<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=mac,width=640,height=420,schemes=light dark" />
    <title>Example Mac settings</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/mac.css" />
    <style>
      html,
      body {
        margin: 0;
        background: var(--bg-sunken);
      }
    </style>
  </head>
  <body>
    <div class="ds-mac-desk">
    <div class="ds-mac-window">
      <header class="ds-mac-titlebar" style="border-bottom: 0"><div class="ds-mac-lights" aria-hidden="true"><i></i><i></i><i></i></div><span class="ds-mac-title">General</span></header>
      <nav class="ds-mac-tabs" aria-label="Settings">
        <div class="ds-mac-tab on"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>General</div>
        <div class="ds-mac-tab"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/></svg>Appearance</div>
        <div class="ds-mac-tab"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Sync</div>
        <div class="ds-mac-tab"><svg class="ds-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Storage</div>
      </nav>
      <div class="ds-mac-settings-body">
        <div class="ds-mac-form">
          <span class="label">Open at login</span><div><div class="ds-mac-check on"><span class="box"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.7l4.5-5"/></svg></span>Open when I log in</div></div>
          <span class="label">Start in</span><div><div class="ds-mac-popup" style="width: 200px"><span>All items</span><span class="arrows"><svg viewBox="0 0 12 12"><path d="M3.5 4.5 6 2l2.5 2.5M3.5 7.5 6 10l2.5-2.5"/></svg></span></div></div>
          <span class="label">View</span><div><div class="ds-mac-seg"><span class="on">List</span><span>Grid</span></div></div>
          <hr class="ds-mac-rule" style="grid-column: 1 / -1" />
          <span class="label">Text size</span><div><div class="ds-mac-slider" style="--v: 40%"></div></div>
          <span class="label">Check for updates</span><div><div class="ds-mac-check on"><span class="box"><svg viewBox="0 0 12 12"><path d="M2.5 6.2 5 8.7l4.5-5"/></svg></span>Automatically</div></div><span class="note">Updates download in the background and install when you quit.</span>
          <span class="label">Name</span><div><div class="ds-mac-field">Placeholder name</div></div>
        </div>
      </div>
    </div>
    </div>
  </body>
</html>
