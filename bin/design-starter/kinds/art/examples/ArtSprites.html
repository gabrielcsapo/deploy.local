<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="design-board" content="platform=art,width=1280,height=960,tile=16,play=48" />
    <title>Example sprite sheet</title>
    <link rel="stylesheet" href="../ds/__DS__/tokens.css" />
    <link rel="stylesheet" href="../ds/__DS__/components.css" />
    <link rel="stylesheet" href="../ds/__DS__/art.css" />
  </head>
  <body>
    <main class="art-sheet">
      <header class="art-head">
        <h1>__NAME__ sprites</h1>
        <p>16 px art on a 16 px tile, drawn at 48 px in play.</p>
      </header>
      <div class="art-row">
        <section data-layer="palette-block">
          <h2 class="art-label">Palette</h2>
          <div class="art-palette" data-layer="palette">
            <figure class="art-swatch">
              <i class="c-ink"></i>
              <figcaption>Ink</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-shade"></i>
              <figcaption>Shade</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-mid"></i>
              <figcaption>Mid</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-light"></i>
              <figcaption>Light</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-white"></i>
              <figcaption>White</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-red"></i>
              <figcaption>Red</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-orange"></i>
              <figcaption>Orange</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-yellow"></i>
              <figcaption>Yellow</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-brown"></i>
              <figcaption>Brown</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-dirt"></i>
              <figcaption>Dirt</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-green"></i>
              <figcaption>Green</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-leaf"></i>
              <figcaption>Leaf</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-blue"></i>
              <figcaption>Blue</figcaption>
            </figure>
            <figure class="art-swatch">
              <i class="c-sky"></i>
              <figcaption>Sky</figcaption>
            </figure>
          </div>
        </section>
        <section data-layer="grounds-block">
          <h2 class="art-label">Played on</h2>
          <div class="art-grounds" data-layer="grounds">
            <figure class="art-swatch wide">
              <i class="art-ground g-day" data-layer="ground-day"></i>
              <figcaption>Day</figcaption>
            </figure>
            <figure class="art-swatch wide">
              <i class="art-ground g-dusk" data-layer="ground-dusk"></i>
              <figcaption>Dusk</figcaption>
            </figure>
            <figure class="art-swatch wide">
              <i class="art-ground g-night" data-layer="ground-night"></i>
              <figcaption>Night</figcaption>
            </figure>
          </div>
        </section>
      </div>
      <div class="art-sets">
        <section class="art-set" data-layer="hero">
          <h2>Hero</h2>
          <p>Walks in two frames.</p>
          <div class="art-frames">
            <figure class="art-cell">
              <svg
                class="art-sprite"
                viewBox="0 0 16 16"
                width="128"
                height="128"
                role="img"
                aria-label="Idle"
                data-layer="hero-idle"
              >
                <path
                  class="c-ink"
                  d="M5 1h6v1h-6zM4 2h1v1h-1zM11 2h1v1h-1zM3 3h1v1h-1zM12 3h1v1h-1zM3 4h1v1h-1zM6 4h1v1h-1zM9 4h1v1h-1zM12 4h1v1h-1zM3 5h1v1h-1zM6 5h1v1h-1zM9 5h1v1h-1zM12 5h1v1h-1zM3 6h1v1h-1zM12 6h1v1h-1zM4 7h1v1h-1zM11 7h1v1h-1zM5 8h6v1h-6zM4 9h1v1h-1zM11 9h1v1h-1zM3 10h1v1h-1zM12 10h1v1h-1zM3 11h1v1h-1zM5 11h1v1h-1zM10 11h1v1h-1zM12 11h1v1h-1zM4 12h1v1h-1zM11 12h1v1h-1zM4 13h1v1h-1zM7 13h2v1h-2zM11 13h1v1h-1zM4 14h3v1h-3zM9 14h3v1h-3z"
                />
                <path
                  class="c-white"
                  d="M5 2h6v1h-6zM4 3h8v1h-8zM4 4h2v1h-2zM7 4h2v1h-2zM10 4h2v1h-2zM4 5h2v1h-2zM7 5h2v1h-2zM10 5h2v1h-2zM4 6h8v1h-8zM5 7h6v1h-6z"
                />
                <path
                  class="c-blue"
                  d="M5 9h6v1h-6zM4 10h8v1h-8zM4 11h1v1h-1zM6 11h4v1h-4zM11 11h1v1h-1zM5 12h6v1h-6zM5 13h2v1h-2zM9 13h2v1h-2z"
                />
              </svg>
              <figcaption>Idle</figcaption>
            </figure>
            <figure class="art-cell">
              <svg
                class="art-sprite"
                viewBox="0 0 16 16"
                width="128"
                height="128"
                role="img"
                aria-label="Step"
                data-layer="hero-step"
              >
                <path
                  class="c-ink"
                  d="M5 1h6v1h-6zM4 2h1v1h-1zM11 2h1v1h-1zM3 3h1v1h-1zM12 3h1v1h-1zM3 4h1v1h-1zM6 4h1v1h-1zM9 4h1v1h-1zM12 4h1v1h-1zM3 5h1v1h-1zM6 5h1v1h-1zM9 5h1v1h-1zM12 5h1v1h-1zM3 6h1v1h-1zM12 6h1v1h-1zM4 7h1v1h-1zM11 7h1v1h-1zM5 8h6v1h-6zM4 9h1v1h-1zM11 9h1v1h-1zM3 10h1v1h-1zM12 10h1v1h-1zM3 11h1v1h-1zM5 11h1v1h-1zM10 11h1v1h-1zM12 11h1v1h-1zM4 12h1v1h-1zM11 12h1v1h-1zM3 13h1v1h-1zM6 13h1v1h-1zM9 13h1v1h-1zM12 13h1v1h-1zM3 14h3v1h-3zM10 14h3v1h-3z"
                />
                <path
                  class="c-white"
                  d="M5 2h6v1h-6zM4 3h8v1h-8zM4 4h2v1h-2zM7 4h2v1h-2zM10 4h2v1h-2zM4 5h2v1h-2zM7 5h2v1h-2zM10 5h2v1h-2zM4 6h8v1h-8zM5 7h6v1h-6z"
                />
                <path
                  class="c-blue"
                  d="M5 9h6v1h-6zM4 10h8v1h-8zM4 11h1v1h-1zM6 11h4v1h-4zM11 11h1v1h-1zM5 12h6v1h-6zM4 13h2v1h-2zM10 13h2v1h-2z"
                />
              </svg>
              <figcaption>Step</figcaption>
            </figure>
          </div>
        </section>
        <section class="art-set" data-layer="slime">
          <h2>Slime</h2>
          <p>Squashes before it hops.</p>
          <div class="art-frames">
            <figure class="art-cell">
              <svg
                class="art-sprite"
                viewBox="0 0 16 16"
                width="128"
                height="128"
                role="img"
                aria-label="Idle"
                data-layer="slime-idle"
              >
                <path
                  class="c-ink"
                  d="M6 5h4v1h-4zM4 6h2v1h-2zM10 6h2v1h-2zM3 7h1v1h-1zM12 7h1v1h-1zM2 8h1v1h-1zM13 8h1v1h-1zM2 9h1v1h-1zM5 9h1v1h-1zM10 9h1v1h-1zM13 9h1v1h-1zM2 10h1v1h-1zM5 10h1v1h-1zM10 10h1v1h-1zM13 10h1v1h-1zM2 11h1v1h-1zM13 11h1v1h-1zM2 12h2v1h-2zM12 12h2v1h-2zM3 13h10v1h-10z"
                />
                <path
                  class="c-green"
                  d="M6 6h4v1h-4zM4 7h1v1h-1zM6 7h6v1h-6zM3 8h1v1h-1zM6 8h7v1h-7zM3 9h2v1h-2zM6 9h4v1h-4zM11 9h2v1h-2zM3 10h2v1h-2zM6 10h4v1h-4zM11 10h2v1h-2zM3 11h10v1h-10zM4 12h8v1h-8z"
                />
                <path class="c-leaf" d="M5 7h1v1h-1zM4 8h2v1h-2z" />
              </svg>
              <figcaption>Idle</figcaption>
            </figure>
            <figure class="art-cell">
              <svg
                class="art-sprite"
                viewBox="0 0 16 16"
                width="128"
                height="128"
                role="img"
                aria-label="Squash"
                data-layer="slime-squash"
              >
                <path
                  class="c-ink"
                  d="M5 7h6v1h-6zM3 8h2v1h-2zM12 8h2v1h-2zM2 9h1v1h-1zM14 9h1v1h-1zM1 10h1v1h-1zM7 10h1v1h-1zM10 10h1v1h-1zM14 10h1v1h-1zM1 11h1v1h-1zM6 11h1v1h-1zM9 11h1v1h-1zM14 11h1v1h-1zM1 12h1v1h-1zM14 12h1v1h-1zM2 13h12v1h-12z"
                />
                <path
                  class="c-green"
                  d="M5 8h7v1h-7zM3 9h1v1h-1zM5 9h9v1h-9zM2 10h1v1h-1zM5 10h2v1h-2zM8 10h2v1h-2zM11 10h3v1h-3zM2 11h4v1h-4zM7 11h2v1h-2zM10 11h4v1h-4zM2 12h12v1h-12z"
                />
                <path class="c-leaf" d="M4 9h1v1h-1zM3 10h2v1h-2z" />
              </svg>
              <figcaption>Squash</figcaption>
            </figure>
          </div>
        </section>
        <section class="art-set" data-layer="coin">
          <h2>Coin</h2>
          <p>A pickup, one frame.</p>
          <div class="art-frames">
            <figure class="art-cell">
              <svg
                class="art-sprite"
                viewBox="0 0 16 16"
                width="128"
                height="128"
                role="img"
                aria-label="Coin"
                data-layer="coin"
              >
                <path
                  class="c-ink"
                  d="M6 3h4v1h-4zM5 4h1v1h-1zM10 4h1v1h-1zM4 5h1v1h-1zM11 5h1v1h-1zM4 6h1v1h-1zM11 6h1v1h-1zM4 7h1v1h-1zM11 7h1v1h-1zM4 8h1v1h-1zM11 8h1v1h-1zM4 9h1v1h-1zM11 9h1v1h-1zM5 10h1v1h-1zM10 10h1v1h-1zM6 11h4v1h-4z"
                />
                <path
                  class="c-yellow"
                  d="M6 4h4v1h-4zM5 5h2v1h-2zM8 5h3v1h-3zM5 6h1v1h-1zM7 6h3v1h-3zM5 7h5v1h-5zM5 8h5v1h-5zM5 9h4v1h-4zM6 10h1v1h-1z"
                />
                <path class="c-white" d="M7 5h1v1h-1zM6 6h1v1h-1z" />
                <path
                  class="c-orange"
                  d="M10 6h1v1h-1zM10 7h1v1h-1zM10 8h1v1h-1zM9 9h2v1h-2zM7 10h3v1h-3z"
                />
              </svg>
              <figcaption>Coin</figcaption>
            </figure>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
